<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Page introuvable · Dynkin</title>
<meta name="robots" content="noindex">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%230B0B0C'/%3E%3Ctext x='16' y='22' text-anchor='middle' font-family='Georgia,serif' font-size='17' fill='%23fff'%3E%CF%80%CE%BB%3C/text%3E%3C/svg%3E">
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#FFFFFF;--text:#0B0B0C;--muted:#5E5F63;--btn:#0B0B0C;--btn-text:#FFFFFF;--btn-hover:#2A2A2D;--focus:#2F5BEA}
@media (prefers-color-scheme: dark){:root{--bg:#000000;--text:#F4F4F2;--muted:#A3A3A6;--btn:#F4F4F2;--btn-text:#0B0B0C;--btn-hover:#D9D9D6;--focus:#7C9BFF}}
*{box-sizing:border-box;margin:0}
body{font-family:'Geist',system-ui,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;display:grid;place-items:center;padding:16px;text-align:center}
main{display:grid;gap:16px;justify-items:center;max-width:480px}
.mark{width:48px;height:48px;border-radius:12px;background:var(--btn);color:var(--btn-text);display:grid;place-items:center;font-size:20px;line-height:28px;font-weight:600}
.heading-4{font-size:30px;line-height:36px;font-weight:600;text-wrap:balance}
.body-3{font-size:16px;line-height:24px;color:var(--muted);text-wrap:pretty}
.btn{display:inline-flex;padding:8px 12px;border-radius:8px;background:var(--btn);color:var(--btn-text);text-decoration:none;font-size:16px;line-height:24px;font-weight:600;transition:background-color 300ms cubic-bezier(0.22,1,0.36,1),transform 300ms cubic-bezier(0.22,1,0.36,1)}
.btn:hover{background:var(--btn-hover)}
.btn:active{transform:scale(0.98)}
.btn:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
</style>
</head>
<body>
<main>
  <span class="mark" aria-hidden="true">πλ</span>
  <h1 class="heading-4">Cette page n'existe pas</h1>
  <p class="body-3">Cette adresse a sans doute changé. Tout ce qu'il faut savoir sur Dynkin tient sur la page d'accueil.</p>
  <a class="btn" href="/dynkin/">Revenir à l'accueil</a>
</main>
</body>
</html>
